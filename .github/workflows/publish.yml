name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Weekly rebuild to pick up security updates in the base ubuntu:24.04 layer
    - cron: "0 2 * * 1"

permissions:
  packages: write
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/danruto/pbuntu:latest
            ghcr.io/danruto/pbuntu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  variants:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [golang, rust, web, runner, editor, agent, factory-runner]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: variants/${{ matrix.variant }}.Dockerfile
          push: true
          pull: true
          tags: |
            ghcr.io/danruto/pbuntu:${{ matrix.variant }}
            ghcr.io/danruto/pbuntu:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Variants built FROM another variant rather than FROM the base, so they have
  # to wait for the variants job to publish the tag they layer on.
  # dev = FROM ghcr.io/danruto/pbuntu:agent
  derived-variants:
    needs: variants
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [dev]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: variants/${{ matrix.variant }}.Dockerfile
          push: true
          pull: true
          tags: |
            ghcr.io/danruto/pbuntu:${{ matrix.variant }}
            ghcr.io/danruto/pbuntu:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
