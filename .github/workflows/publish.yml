name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Weekly rebuild to pick up security updates in the base ubuntu:24.04 layer
    - cron: "0 2 * * 1"

permissions:
  packages: write
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/danruto/pbuntu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  variants:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [golang, rust, web, runner, editor]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull base image
        run: docker pull ghcr.io/danruto/pbuntu:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: variants/${{ matrix.variant }}.Dockerfile
          push: true
          tags: ghcr.io/danruto/pbuntu:${{ matrix.variant }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
