name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Weekly rebuild to pick up security updates in the ubuntu base layer
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/danruto/pbuntu:latest
            ghcr.io/danruto/pbuntu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One dev image per toolchain set. The tag is what the control plane pins
  # per environment: dev-<toolchains>-<sha>. Every subset the control plane can
  # declare is built, because a project declaring one it cannot pin is refused
  # outright — "base" being the set with nothing in it, which is what a project
  # naming no toolchain gets.
  dev:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchains: [base, go, rust, bun, go-rust, go-bun, rust-bun, go-rust-bun]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # "base" names the empty set, not a toolchain: it builds the dev image
      # with the harness and no compilers, so it resolves to an empty arg.
      - id: set
        env:
          TOOLCHAINS: ${{ matrix.toolchains }}
        run: |
          if [ "$TOOLCHAINS" = base ]; then
            TOOLCHAINS=""
          fi
          echo "arg=$(echo "$TOOLCHAINS" | tr '-' ',')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: variants/dev.Dockerfile
          push: true
          pull: true
          build-args: |
            TOOLCHAINS=${{ steps.set.outputs.arg }}
          tags: |
            ghcr.io/danruto/pbuntu:dev-${{ matrix.toolchains }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: pbuntu
          exclude-tags: "latest"
          delete-untagged: true
          keep-n-tagged: 20
